[project]
name = "financejob"
version = "0.1.0"
description = "金融求职全自动投递系统"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.48.0",
    "drissionpage>=4.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "requests>=2.32.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.9.0",
    "httpx>=0.28.0",
    "openai>=1.55.0",
    "rich>=13.9.0",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.0.0",
    "fonttools>=4.55.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.5.0",
    "markdown>=3.7.0",
    "weasyprint>=62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
